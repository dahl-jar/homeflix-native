name: android-tv

on:
  push:
    branches: [main]
    paths:
      - "apps/android-tv/**"
      - ".github/workflows/android-tv.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Lint
        run: ./gradlew ktlintCheck detekt lintDebug
        working-directory: apps/android-tv

      - name: Test
        run: ./gradlew testDebugUnitTest
        working-directory: apps/android-tv

  release:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Build unsigned release
        run: ./gradlew :app:assembleRelease
        working-directory: apps/android-tv

      - name: Decode signing key
        env:
          ANDROID_TV_KEYSTORE_BASE64: ${{ secrets.ANDROID_TV_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_TV_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_TV_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/homeflix-tv-release.p12"

      - name: Sign release
        env:
          ANDROID_TV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TV_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_TV_KEYSTORE_PASSWORD"
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$apksigner"
          unsigned="apps/android-tv/app/build/outputs/apk/release/app-release-unsigned.apk"
          signed="apps/android-tv/app/build/outputs/apk/release/app-release.apk"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/homeflix-tv-release.p12" \
            --ks-type PKCS12 \
            --ks-key-alias homeflix-tv \
            --ks-pass env:ANDROID_TV_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_TV_KEYSTORE_PASSWORD \
            --out "$signed" \
            "$unsigned"
          "$apksigner" verify --verbose --print-certs "$signed"

      - name: Compute next tag
        id: tag
        run: |
          last=$(git tag -l 'android-tv-v*' | sed 's/android-tv-v//' | sort -n | tail -1)
          next=$(( ${last:-0} + 1 ))
          echo "name=android-tv-v${next}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          files: apps/android-tv/app/build/outputs/apk/release/app-release.apk
