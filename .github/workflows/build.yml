name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the gate
        run: pnpm check

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Prebuild iOS project
        run: pnpm exec expo prebuild --platform ios --no-install

      - name: Install pods
        run: cd ios && pod install

      - name: Build unsigned release
        run: >
          xcodebuild build
          -workspace ios/Homeflix.xcworkspace
          -scheme Homeflix
          -configuration Release
          -sdk iphoneos
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Homeflix.app Payload/
          zip -qry Homeflix.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Homeflix-unsigned-ipa
          path: Homeflix.ipa
