name: build

on:
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
      - "LICENSE"
      - "NOTICE.md"
  pull_request:
    branches: [main]
    paths:
      - "apps/ios/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
      - "LICENSE"
      - "NOTICE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/ios

      - name: Lint
        run: pnpm lint
        working-directory: apps/ios

      - name: Typecheck
        run: pnpm typecheck
        working-directory: apps/ios

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/ios

      - name: Test repository metadata
        run: node --test "scripts/**/*.test.*"

      - name: Test iOS
        run: pnpm test
        working-directory: apps/ios

      - name: Check duplication
        run: pnpm dup
        working-directory: apps/ios

      - name: Audit dependencies
        run: pnpm audit --audit-level=low
        working-directory: apps/ios

  build:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/ios

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Prebuild iOS project
        run: pnpm exec expo prebuild --platform ios --no-install
        working-directory: apps/ios

      - name: Install pods
        run: pod install
        working-directory: apps/ios/ios

      - name: Build unsigned release
        run: >
          xcodebuild build
          -workspace ios/Homeflix.xcworkspace
          -scheme Homeflix
          -configuration Release
          -sdk iphoneos
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
        working-directory: apps/ios

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Homeflix.app Payload/
          zip -qry Homeflix.ipa Payload
        working-directory: apps/ios

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Homeflix-unsigned-ipa
          path: apps/ios/Homeflix.ipa
