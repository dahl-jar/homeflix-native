name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Check duplication
        run: pnpm dup

      - name: Audit dependencies
        run: pnpm audit --audit-level=low

  build:
    needs: test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Prebuild iOS project
        run: pnpm exec expo prebuild --platform ios --no-install
        working-directory: apps/ios

      - name: Install pods
        run: pod install
        working-directory: apps/ios/ios

      - name: Build unsigned release
        run: >
          xcodebuild build
          -workspace ios/Homeflix.xcworkspace
          -scheme Homeflix
          -configuration Release
          -sdk iphoneos
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
        working-directory: apps/ios

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Homeflix.app Payload/
          zip -qry Homeflix.ipa Payload
        working-directory: apps/ios

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Homeflix-unsigned-ipa
          path: apps/ios/Homeflix.ipa
